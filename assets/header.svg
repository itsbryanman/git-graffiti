<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">git-graffiti</title>
  <desc id="desc">Commit hashes painted across a dark terminal window</desc>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <filter id="rough" x="-10%" y="-20%" width="120%" height="150%">
      <feTurbulence baseFrequency="0.025 0.12" numOctaves="2" seed="17" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3"/>
    </filter>
  </defs>
  <rect width="1200" height="300" rx="18" fill="url(#wall)"/>
  <circle cx="32" cy="28" r="7" fill="#ff5f56"/>
  <circle cx="56" cy="28" r="7" fill="#ffbd2e"/>
  <circle cx="80" cy="28" r="7" fill="#27c93f"/>
  <g fill="#586069" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24">
    <text x="54" y="92">deadbee</text>
    <text x="990" y="94">c0ffee0</text>
    <text x="80" y="246">badcafe</text>
    <text x="1010" y="250">defaced</text>
  </g>
  <g filter="url(#rough)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="900">
    <text x="120" y="190" fill="#ff4d8d" font-size="106" letter-spacing="-8">git-</text>
    <text x="332" y="190" fill="#7ee787" font-size="106" letter-spacing="-8">graffiti</text>
  </g>
  <g fill="#7ee787" opacity="0.9">
    <rect x="790" y="198" width="9" height="42" rx="4"/>
    <rect x="840" y="198" width="7" height="24" rx="3"/>
    <circle cx="795" cy="251" r="5"/>
  </g>
  <path d="M110 214 C270 229 376 207 512 220 S790 231 921 211" fill="none" stroke="#ff4d8d" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
  <text x="600" y="276" text-anchor="middle" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">your commit graph needed worse ideas</text>
</svg>
