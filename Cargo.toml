[package]
name = "git-graffiti"
version = "0.1.0"
edition = "2024"
description = "Mine git commit hashes and write dumb things in your log"
license = "MIT"
repository = "https://github.com/itsbryanman/git-graffiti"

[[bin]]
name = "git-graffiti"
path = "src/main.rs"

[features]
default = []
opencl = ["dep:ocl"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
ocl = { version = "0.19", optional = true }

[dev-dependencies]
sha1 = "0.10"
tempfile = "3.14"

[[bench]]
name = "prefixes"
"harn\u0065ss" = false
